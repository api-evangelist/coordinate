generated: '2026-07-18'
method: searched
source: https://app.coordinatehq.com/static/API_Documentation.md
format: custom-json
envelope: '{"success": false, "error": "<message>"}'
note: >-
  Coordinate does not use RFC 9457 problem+json. Validation and server errors
  return a JSON envelope {"success": false, "error": "..."}; 404 is frequently a
  plain-text body (e.g. "Project Not Found"). Derived from documented HTTP status
  behavior in the published API reference.
problems:
  - status: 400
    title: Validation error
    body: '{"success": false, "error": "<message>"}'
    remediation: >-
      Fix the invalid/missing field. Example: inviting an email that is already a
      stakeholder returns "collaborator with email address ... already exists on
      project".
  - status: 401
    title: Unauthorized
    body: Unauthorized
    remediation: Send a valid API key in the `Bearer:` header. Missing or invalid key returns 401.
  - status: 403
    title: Forbidden
    body: null
    remediation: >-
      Returned on file download when files are disabled for the vendor. Enable
      files or contact support.
  - status: 404
    title: Not found
    body: 'plain text, e.g. "Project Not Found" / "Unknown email address"'
    remediation: >-
      Verify the resource id, external_object_id, or sender email. Posting a
      value for a custom field not predefined on the vendor also returns 404.
  - status: 413
    title: Payload too large
    body: null
    remediation: File upload exceeded the 100MB per-request limit (or JSON storage exceeded 300KB). Reduce payload size.
  - status: 500
    title: Server error
    body: '{"success": false, "error": "Server Error"}'
    remediation: Transient server error; retry with backoff. Contact support@coordinatehq.com if persistent.
