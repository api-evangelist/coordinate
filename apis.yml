aid: coordinate
name: Coordinate
description: >-
  Coordinate (CoordinateHQ) is a client project-execution platform and branded
  client portal for client-facing businesses — agencies, professional services,
  and B2B onboarding teams. It turns repeatable workflows into automated,
  interactive projects with tasks, task groups, goals, progress reports, forms,
  eSignatures, time tracking, and in-project chat, while giving each client a
  simple password-free portal. Coordinate exposes a REST API (base
  https://app.coordinatehq.com/api/v1) for creating and syncing projects, tasks,
  groups, stakeholders, goals, comments, and organizations, an /entity export
  firehose for bulk sync, and a webhook API for real-time create/update events,
  alongside bi-directional Zapier integrations. This profile was enriched by the
  API Evangelist pipeline from Coordinate's published API reference.
